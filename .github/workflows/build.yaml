name: Build
permissions:
  contents: read
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-orders:
    name: Build Orders Service
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '25'
      - run: java --version
      - name: Build App
        run: mvn clean package -DskipTests
        working-directory: orders

  build-notifications:
    name: Build Notifications Service
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '25'
      - run: java --version
      - name: Build App
        run: mvn clean package -DskipTests
        working-directory: notifications
